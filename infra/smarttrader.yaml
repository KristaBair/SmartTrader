AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  InvestSmart AWS backend: Cognito user pool for sign-in, DynamoDB table for user
  data, S3 bucket for uploaded brokerage screenshots, and a least-privilege IAM
  policy for the app server (DynamoDB, S3, and Bedrock model invocation).

Parameters:
  AppName:
    Type: String
    Default: smarttrader
    AllowedPattern: "[a-z0-9-]+"
    Description: Lowercase prefix used in resource names.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: >-
      Cross-region inference profile ID the server calls (must match the
      BEDROCK_MODEL_ID secret). Confirm with `aws bedrock list-inference-profiles`.
  ScreenshotRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days to keep uploaded screenshots before S3 deletes them.

Resources:
  # ── Authentication ───────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AppName}-users"
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: given_name
          Required: true
          Mutable: true
        - Name: family_name
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # Public browser client: no secret, SRP sign-in, short-lived access tokens.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ── User data ────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-data"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ── Uploaded screenshots ─────────────────────────────────────────────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-uploads-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireScreenshots
            Status: Enabled
            Prefix: screenshots/
            ExpirationInDays: !Ref ScreenshotRetentionDays

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadsBucket.Arn
              - !Sub "${UploadsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ── Permissions for the app server ───────────────────────────────────────
  # Attach to the IAM role (when hosted on AWS) or IAM user (when hosted
  # elsewhere, e.g. Replit) whose credentials the server runs with.
  AppServerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppName}-app-server"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UserData
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
            Resource: !GetAtt Table.Arn
          - Sid: StoreScreenshots
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "${UploadsBucket.Arn}/screenshots/*"
          - Sid: InvokeInferenceProfile
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
          # Cross-region inference routes to the underlying model in any region
          # of the profile's geography, but only when called through the profile.
          - Sid: InvokeModelViaProfile
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource: !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*"
            Condition:
              StringEquals:
                bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"

Outputs:
  AwsRegion:
    Description: AWS_REGION secret
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Description: COGNITO_USER_POOL_ID secret
    Value: !Ref UserPool
  CognitoClientId:
    Description: COGNITO_CLIENT_ID secret
    Value: !Ref UserPoolClient
  DynamoDbTable:
    Description: DYNAMODB_TABLE secret
    Value: !Ref Table
  S3Bucket:
    Description: S3_BUCKET secret
    Value: !Ref UploadsBucket
  AppServerPolicyArn:
    Description: Attach this policy to the identity the server runs as
    Value: !Ref AppServerPolicy
